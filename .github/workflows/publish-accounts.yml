name: Publish @clusterflick/accounts

# Publishes the package when its version is one npm doesn't have yet, as
# publish-catalogue.yml does the catalogue: the Workers install it from npm,
# and the site reads its source. A release is a version bump in
# packages/accounts/package.json. 0.1.0 was published by hand, before the
# package existed for its trusted publisher to be configured.
on:
  push:
    branches: [main]
    paths:
      - "packages/accounts/**"
  workflow_dispatch:

concurrency:
  group: publish-accounts
  cancel-in-progress: false

# Deny all by default; the job grants only what it needs.
permissions: {}

jobs:
  publish:
    name: Publish if the version is new
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm's trusted publishing: the workflow proves who it is to npm with an
      # OIDC token, so there's no npm token stored anywhere. Configured on the
      # package's settings on npmjs.com, which name this file.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          # As npm advises for release builds.
          package-manager-cache: false
      - name: Is this version on npm yet?
        id: version
        # Every published version, rather than asking for this one: npm answers
        # a version it doesn't have with an error, which can't be told from a
        # failed lookup. A failed lookup fails the job, never publishes blind.
        run: |
          version=$(node -p 'require("./packages/accounts/package.json").version')
          versions=$(npm view @clusterflick/accounts versions --json)
          if VERSIONS="$versions" VERSION="$version" node -e '
            const versions = [JSON.parse(process.env.VERSIONS)].flat();
            process.exit(versions.includes(process.env.VERSION) ? 0 : 1);
          '; then
            echo "$version is already published"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "$version is new"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.new == 'true'
        run: npm ci
      # The package's own tests: the site's `npm test` also loads Storybook,
      # which needs the site's data, and none of it is downloaded here.
      - if: steps.version.outputs.new == 'true'
        run: npm test -w @clusterflick/accounts
      - if: steps.version.outputs.new == 'true'
        run: npm run check -w @clusterflick/accounts
      - if: steps.version.outputs.new == 'true'
        run: npm publish -w @clusterflick/accounts --access public
      # npm scans a new version for malware before anyone can install it,
      # typically for five minutes and sometimes 15 or more, and may hold it for
      # review or block it. So a publish that succeeded isn't yet a release:
      # this waits until the version is installable, and fails if it never is.
      # A push in the meantime queues behind this run (the concurrency group),
      # then finds the version published and stops, rather than publishing it
      # again into npm's 409 for a version still being scanned.
      - if: steps.version.outputs.new == 'true'
        name: Wait for npm to make it available
        timeout-minutes: 30
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in $(seq 1 60); do
            versions=$(npm view @clusterflick/accounts versions --json --prefer-online)
            if VERSIONS="$versions" node -e '
              const versions = [JSON.parse(process.env.VERSIONS)].flat();
              process.exit(versions.includes(process.env.VERSION) ? 0 : 1);
            '; then
              echo "$VERSION is available"
              exit 0
            fi
            echo "$VERSION isn't available yet ($attempt of 60)"
            sleep 30
          done
          echo "::error::$VERSION wasn't available 30 minutes after publishing. Check the package on npmjs.com: npm may have held it for review or blocked it."
          exit 1
